<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Stock Evaluator{% endblock %}</title>
<style>
  :root {
    --bg: #10141a; --panel: #1a2029; --border: #2b3442; --text: #d7dde6;
    --dim: #8a94a3; --accent: #5aa9e6; --good: #4caf7d; --warn: #e0b341; --bad: #e06c5a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 1.2rem 1rem 4rem; }
  header.top { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 1.4rem; }
  header.top h1 { font-size: 1.15rem; margin: 0; }
  header.top form { margin-left: auto; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
           padding: 0.9rem 1.1rem; margin-bottom: 1rem; }
  .panel h2 { margin: 0 0 .6rem; font-size: .8rem; letter-spacing: .08em;
              text-transform: uppercase; color: var(--dim); }
  .panel.flag-red { border-color: #6b3028; }
  .panel.flag-yellow { border-color: #6b5a28; }
  table { border-collapse: collapse; width: 100%; }
  td, th { padding: .25rem .6rem; text-align: left; }
  th { color: var(--dim); font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; }
  tr + tr td { border-top: 1px solid var(--border); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .dim { color: var(--dim); } .big { font-size: 1.25rem; font-weight: 700; }
  input[type=text], input[type=password] {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: .55rem .7rem; font-size: 1rem; width: 100%;
  }
  button { background: var(--accent); color: #08111c; font-weight: 700; border: 0;
           border-radius: 6px; padding: .55rem 1.1rem; font-size: .95rem; cursor: pointer; }
  button.ghost { background: transparent; color: var(--dim); border: 1px solid var(--border); font-weight: 500; }
  .msg { background: #263041; border: 1px solid var(--accent); border-radius: 6px;
         padding: .6rem .9rem; margin-bottom: 1rem; }
  .badge { display: inline-block; border-radius: 999px; padding: .05rem .6rem; font-size: .78rem; font-weight: 600; }
  .badge.done { background: #1d3529; color: var(--good); }
  .badge.running, .badge.queued { background: #33301d; color: var(--warn); }
  .badge.failed { background: #3a221d; color: var(--bad); }
  ul { margin: .3rem 0; padding-left: 1.2rem; }
  li { margin: .18rem 0; }
  .spinner { width: 26px; height: 26px; border: 3px solid var(--border); border-top-color: var(--accent);
             border-radius: 50%; animation: spin 0.9s linear infinite; display: inline-block; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  @media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }
  .footnote { color: var(--dim); font-size: .88rem; border-top: 1px dashed var(--border);
              margin-top: .7rem; padding-top: .6rem; }
</style>
</head>
<body>
<div class="wrap">
  {% block header %}
  <header class="top">
    <h1><a href="/">📊 Stock Evaluator</a></h1>
    <form method="post" action="/logout"><button class="ghost" type="submit">Log out</button></form>
  </header>
  {% endblock %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
