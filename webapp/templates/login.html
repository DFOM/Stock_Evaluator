{% extends "base.html" %}
{% block title %}Log in — Stock Evaluator{% endblock %}
{% block header %}{% endblock %}
{% block content %}
<div style="max-width: 360px; margin: 14vh auto 0;">
  <div class="panel">
    <h2>Stock Evaluator — Log in</h2>
    {% if error %}<p class="bad">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <p><input type="text" name="username" placeholder="Username" autocomplete="username" required autofocus></p>
      <p><input type="password" name="password" placeholder="Password" autocomplete="current-password" required></p>
      <button type="submit" style="width:100%">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
